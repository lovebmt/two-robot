; Firmware ESP32 cho two-robot. Xem README.md trong thư mục này.
;   pio run -e esp32dev                 build
;   pio run -e esp32dev -t upload       nạp
;   pio device monitor                  xem log (115200)
;   pio test -e native                  test lõi thuật toán trên máy tính
;   pio run -e ota -t upload --upload-port 192.168.1.19   nạp qua WiFi (OTA)
;   nc 192.168.1.19 23                   console qua WiFi (telnet)

[platformio]
default_envs = esp32dev

[env]
lib_deps =
  bblanchon/ArduinoJson@^7.2.0

[env:esp32dev]
; Cố định platform 6.8.1 = Arduino-ESP32 2.0.17 (IDF 4.4): API LEDC/PCNT dùng trong hal_esp32.cpp
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -O2
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  ${env.lib_deps}
  pololu/VL53L0X@^1.3.1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DTR_NATIVE -Wall
build_src_filter = -<*>

[env:ota]
; Nạp qua WiFi (ArduinoOTA). Robot phải đang chạy firmware có OTA và cùng mạng LAN.
; Đổi IP:  pio run -e ota -t upload --upload-port <IP robot>
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.1.19
upload_flags =
  --auth=tworobot
  --port=3232
