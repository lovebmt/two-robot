[project]
name = "tworobot-control"
version = "0.1.0"
description = "Web Control + mô phỏng 2 robot ESP32 bám nhau"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tworobot-server = "tworobot.app:main"
tworobot-batch = "tworobot.sim.batch:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]
